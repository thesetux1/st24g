<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stark VPN Reloaded – 25GB Free Data</title>

<style>
body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,#111,#3a0000);
  display:flex;
  justify-content:center;
  padding-top:40px;
}
.app{
  width:360px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  overflow:hidden;
}
.header{
  background:linear-gradient(135deg,#c62828,#8e0000);
  color:#fff;
  padding:18px;
  text-align:center;
}
.promo{
  background:#ffeb3b;
  color:#000;
  padding:6px 14px;
  border-radius:20px;
  display:inline-block;
  margin-top:8px;
  font-weight:700;
}
.connect-wrapper{
  background:linear-gradient(135deg,#b71c1c,#7f0000);
  padding:30px 0;
  display:flex;
  justify-content:center;
}
.connect{
  width:140px;
  height:140px;
  border-radius:50%;
  background:radial-gradient(circle,#4caf50,#2e7d32);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  color:#fff;
}

/* POPUPS */
.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}
.popup-box{
  background:#fff;
  padding:24px;
  width:85%;
  max-width:330px;
  border-radius:14px;
  text-align:center;
}
.popup-box h3{margin-top:0;color:#c62828}
.popup-box input{
  width:100%;
  padding:11px;
  margin:12px 0;
  border-radius:8px;
  border:1px solid #ccc;
}
.popup-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,#4caf50,#2e7d32);
  color:#fff;
  font-weight:700;
}

/* PROGRESS */
.fill{
  background:#eee;
  height:12px;
  border-radius:10px;
  overflow:hidden;
}
#fill2{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#4caf50,#2e7d32);
  transition:width .3s;
}
.percentage{margin-top:8px;font-weight:700}

/* ERROR POPUP */
#shareError h3{color:#d32f2f}
#shareError button{
  background:linear-gradient(135deg,#c62828,#8e0000);
}
#whatsapp img{height:22px;margin-right:8px}
</style>
</head>

<body>

<div class="app">
  <div class="header">
    <h1>Stark VPN Reloaded</h1>
    <div class="promo">🎉 25GB FREE DATA</div>
  </div>

  <div class="connect-wrapper">
    <div class="connect">🛡️</div>
  </div>
</div>

<!-- POPUP 1 -->
<div class="popup-overlay" id="popupForm">
  <div class="popup-box">
    <h3>25GB Data Giveaway</h3>
    <input type="text" id="userNumber" placeholder="08031234567">
    <button id="claimBtn">CLAIM DATA</button>
  </div>
</div>

<!-- POPUP 2 -->
<div class="popup-overlay" id="popupShare" style="display:none;">
  <div class="popup-box">
    <p>Share to <b>15 WhatsApp groups/friends</b></p>
    <button id="whatsapp">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
      SHARE ON WHATSAPP
    </button>

    <div style="margin-top:15px">
      <div class="fill"><div id="fill2"></div></div>
      <div class="percentage" id="percentage2">0%</div>
    </div>
  </div>
</div>

<!-- SHARE ERROR -->
<div class="popup-overlay" id="shareError" style="display:none;">
  <div class="popup-box">
    <h3>Sharing Failed!</h3>
    <p style="font-size:14px">
      The same group or the same friend is invalid.<br>
      Please check and share again.
    </p>
    <button id="errorOkBtn">OK</button>
  </div>
</div>

<script>
const REQUIRED_SHARES = 15;
const FIRST_SHARE_PERCENT = 45;
const SHARE_DELAY = 6000;

let shareCount = parseInt(localStorage.getItem("share_count")) || 0;
let uniqueShares = JSON.parse(localStorage.getItem("unique_ids")) || [];
let lastShareClick = 0;

const fill2 = document.getElementById("fill2");
const percentage2 = document.getElementById("percentage2");
const popupForm = document.getElementById("popupForm");
const popupShare = document.getElementById("popupShare");
const shareError = document.getElementById("shareError");

function updateProgress(){
  let percent = 0;

  if(shareCount === 0){
    percent = 0;
  }else if(shareCount === 1){
    percent = FIRST_SHARE_PERCENT;
  }else{
    percent = FIRST_SHARE_PERCENT +
      ((shareCount-1)/(REQUIRED_SHARES-1)) * (100 - FIRST_SHARE_PERCENT);
  }

  if(percent > 100) percent = 100;
  fill2.style.width = percent + "%";
  percentage2.innerText = Math.floor(percent) + "%";

  if(shareCount >= REQUIRED_SHARES){
    setTimeout(()=>location.href="claim.htm",1500);
  }
}

updateProgress();

document.getElementById("claimBtn").onclick=()=>{
  popupForm.style.display="none";
  popupShare.style.display="flex";
};

document.getElementById("errorOkBtn").onclick=()=>{
  shareError.style.display="none";
};

document.getElementById("whatsapp").onclick=()=>{
  const now = Date.now();

  if(now - lastShareClick < SHARE_DELAY){
    shareError.style.display="flex";
    return;
  }
  lastShareClick = now;

  const id = Math.floor(Math.random()*1000000);
  if(uniqueShares.includes(id)){
    shareError.style.display="flex";
    return;
  }

  uniqueShares.push(id);
  localStorage.setItem("unique_ids",JSON.stringify(uniqueShares));

  shareCount++;
  localStorage.setItem("share_count",shareCount);
  updateProgress();

  setTimeout(()=>{
    const msg = encodeURIComponent(
      "🔥 I just qualified for STARK VPN FREE 25GB DATA! " + location.href
    );
    location.href = "whatsapp://send?text=" + msg;
  },500);
};
</script>

</body>
</html>
