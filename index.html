<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>Stark VPN Reloaded – 25GB Free Data</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI',Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#111,#3a0000);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding-top:40px;
}

/* APP CARD */
.app{
  width:360px;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#c62828,#8e0000);
  color:#fff;
  padding:18px 16px 22px;
  text-align:center;
}
.header h1{
  margin:0;
  font-size:18px;
  font-weight:700;
}
.promo{
  margin-top:10px;
  background:#ffeb3b;
  color:#000;
  display:inline-block;
  padding:6px 14px;
  border-radius:20px;
  font-weight:800;
  font-size:13px;
}
.sub-promo{
  margin-top:6px;
  font-size:13px;
}

/* CONNECT */
.connect-wrapper{
  background:linear-gradient(135deg,#b71c1c,#7f0000);
  padding:35px 0 15px;
  display:flex;
  justify-content:center;
}
.connect{
  width:150px;
  height:150px;
  background:radial-gradient(circle,#4caf50,#2e7d32);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  color:#fff;
}

/* POPUPS */
.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}
.popup-box{
  background:#fff;
  padding:26px 22px;
  width:85%;
  max-width:330px;
  border-radius:14px;
  text-align:center;
}
.popup-box h3{
  margin-top:0;
  color:#c62828;
}
.popup-box input{
  width:100%;
  padding:11px;
  margin:12px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}
.popup-box button{
  width:100%;
  padding:12px;
  background:linear-gradient(135deg,#4caf50,#2e7d32);
  border:none;
  color:#fff;
  font-size:15px;
  font-weight:700;
  border-radius:8px;
  cursor:pointer;
}

/* PROGRESS */
.fill{
  background:#eee;
  height:12px;
  border-radius:10px;
  overflow:hidden;
}
#fill2{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#4caf50,#2e7d32);
  transition:width .3s;
}
.percentage{
  margin-top:8px;
  font-weight:700;
}

/* SOFT ERROR PUSH */
#softShareError h3{color:#d32f2f}
#softShareError button{
  background:linear-gradient(135deg,#c62828,#8e0000);
}

/* WhatsApp */
#whatsapp img{
  height:24px;
  vertical-align:middle;
  margin-right:8px;
}
</style>
</head>

<body>

<div class="app">
  <div class="header">
    <h1>Stark VPN Reloaded</h1>
    <div class="promo">🎉 25GB FREE DATA 🎉</div>
    <div class="sub-promo">Giveaway for ALL Networks</div>
  </div>

  <div class="connect-wrapper">
    <div class="connect">🛡️</div>
  </div>
</div>

<!-- POPUP 1 -->
<div class="popup-overlay" id="popupForm">
  <div class="popup-box">
    <h3>25GB Data Giveaway</h3>
    <input type="text" id="userNumber" placeholder="08031234567">
    <button id="claimBtn">CLAIM 25GB DATA</button>
  </div>
</div>

<!-- POPUP 2 -->
<div class="popup-overlay" id="popupShare" style="display:none;">
  <div class="popup-box">
    <p>Share to <strong>15 WhatsApp groups/friends</strong></p>
    <button id="whatsapp">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
      SHARE ON WHATSAPP
    </button>

    <div style="margin-top:15px">
      <div class="fill"><div id="fill2"></div></div>
      <div class="percentage" id="percentage2">0%</div>
    </div>
  </div>
</div>

<!-- SOFT ERROR PUSH -->
<div class="popup-overlay" id="softShareError" style="display:none;">
  <div class="popup-box">
    <h3>Sharing Failed!</h3>
    <p style="font-size:14px;line-height:1.5;">
      The same group or the same friend is invalid.<br>
      Please check and share again.
    </p>
    <button id="softErrorOk">OK</button>
  </div>
</div>

<script>
/* CONFIG */
const REQUIRED_SHARES = 15;
const FIRST_SHARE_PERCENT = 45;
const SHARE_RATE_LIMIT = 7000;

/* STORAGE */
let shareCount = parseInt(localStorage.getItem("share_count")) || 0;
let uniqueShares = JSON.parse(localStorage.getItem("unique_ids")) || [];
let lastShareAttempt = 0;

/* ELEMENTS */
const popupForm = document.getElementById("popupForm");
const popupShare = document.getElementById("popupShare");
const whatsappBtn = document.getElementById("whatsapp");
const fill2 = document.getElementById("fill2");
const percentage2 = document.getElementById("percentage2");
const softShareError = document.getElementById("softShareError");
const softErrorOk = document.getElementById("softErrorOk");

/* PROGRESS LOGIC (UNCHANGED BEHAVIOR) */
function updateProgress(){
  let percent = 0;

  if(shareCount === 0){
    percent = 0;
  }else if(shareCount === 1){
    percent = FIRST_SHARE_PERCENT;
  }else{
    percent = FIRST_SHARE_PERCENT +
      ((shareCount - 1) / (REQUIRED_SHARES - 1)) *
      (100 - FIRST_SHARE_PERCENT);
  }

  if(percent > 100) percent = 100;
  fill2.style.width = percent + "%";
  percentage2.innerText = Math.floor(percent) + "%";

  if(shareCount >= REQUIRED_SHARES){
    setTimeout(()=>window.location.href="claim.htm",1500);
  }
}
updateProgress();

/* HELPERS */
function generateGroupID(){
  return Math.floor(Math.random()*1000000);
}

/* EVENTS */
document.getElementById("claimBtn").onclick = ()=>{
  popupForm.style.display="none";
  popupShare.style.display="flex";
};

softErrorOk.onclick = ()=>{
  softShareError.style.display="none";
};

whatsappBtn.onclick = ()=>{
  const now = Date.now();

  /* RATE LIMIT */
  if(now - lastShareAttempt < SHARE_RATE_LIMIT){
    softShareError.style.display="flex";
    return;
  }

  const groupID = generateGroupID();

  /* SAME GROUP / FRIEND BLOCK */
  if(uniqueShares.includes(groupID)){
    softShareError.style.display="flex";
    return;
  }

  /* ALLOW SHARE */
  lastShareAttempt = now;

  uniqueShares.push(groupID);
  localStorage.setItem("unique_ids",JSON.stringify(uniqueShares));

  shareCount++;
  localStorage.setItem("share_count",shareCount);
  updateProgress();

  setTimeout(()=>{
    const msg = encodeURIComponent(
      "🔥 I just qualified for STARK VPN UNLIMITED DATA! " + window.location.href
    );
    window.location.href = "whatsapp://send?text=" + msg;
  },500);
};
</script>

</body>
</html>
